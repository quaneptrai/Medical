# Canonical runtime configuration. Environment variables remain explicit
# deployment overrides; evaluation scripts must record any override they use.
project:
  name: BotMedical
  version: 0.2.0

llm:
  provider: ollama
  ollama_model: llama3.1:8b
  ollama_base_url: http://localhost:11434/v1
  gemini_model: gemini-3.6-flash
  temperature: 0.1
  max_tokens: 2048

retrieval:
  # Selected provisionally from artifacts/evaluation/bm25_weight_sweep.json.
  # Revisit only after the independently labeled clinical holdout exists.
  embedding_model: models/bge-m3-medical-v2-recovered-a050-fp16
  diseases_dir: data/diseases_expanded
  vector_db_path: data/embeddings
  top_k: 3
  bm25_weight: 0.15

safety:
  deterministic_rules: hard_override
  semantic:
    mode: advisory
    calibration: artifacts/evaluation/guardrail_calibration.json
    rationale: >-
      Keep the alpha-0.07 model pinned because threshold 0.58 was calibrated on
      that exact artifact. Semantic similarity is advisory only; deterministic
      red-flag rules own automatic emergency escalation.

conversation:
  max_turns: 6
